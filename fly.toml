# Fly.io — persistent volume keeps the database + uploads:
#   fly launch --no-deploy   (keep this file)  ->  fly volumes create ceyteq_data -s 1  ->  fly deploy
app = "ceyteq-site"
primary_region = "sin"

[build]

[env]
  CEYTEQ_DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "ceyteq_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # scale to zero when nobody is visiting
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
