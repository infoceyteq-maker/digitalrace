# Render blueprint — https://render.com/docs/blueprint-spec
# Push this repo to GitHub, then: Render dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: ceyteq-site
    runtime: python
    plan: starter          # a persistent disk needs a paid instance; 'free' works but loses the DB on redeploy
    buildCommand: "true"   # no dependencies — Python standard library only
    startCommand: python3 server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CEYTEQ_ADMIN_PASSWORD
        sync: false        # set it in the dashboard, never in git
      - key: CEYTEQ_DATA_DIR
        value: /var/data
    disk:
      name: ceyteq-data
      mountPath: /var/data
      sizeGB: 1
